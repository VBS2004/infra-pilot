name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The src/ restructure silently lost symbols twice; undefined names fail the build.
      - name: Lint (undefined names)
        run: pip install ruff && ruff check --select F821,F811,F823 src tests data_pipeline cli.py

      # The core install has no dependencies: these suites must pass on the bare stdlib.
      - name: Install (zero dependencies)
        run: pip install -e .

      - name: Zero-dependency tests
        run: |
          for f in tests/test_index.py tests/test_planner.py tests/test_root_schema.py \
                   tests/test_commands.py tests/test_compose_e2e.py tests/test_validate.py \
                   tests/test_data_tools.py; do
            echo "::group::$f"; python "$f"; echo "::endgroup::"
          done

      - name: Install optional extras
        run: pip install -e ".[full]"

      - name: Full test suite
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"; python "$f"; echo "::endgroup::"
          done
