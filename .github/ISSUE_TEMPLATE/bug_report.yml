name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: CLI command and repo structure (anonymized if needed)
      placeholder: |
        1. python cli.py ./my-repo compose "..."
        2. Expected: ...
        3. Got: ...
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.11"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant environment variables (redact API keys!)
      placeholder: |
        LLM_GATEWAY_BASE=https://api.deepseek.com
        LLM_EMBED_ENABLED=1
        LLM_EMBED_BACKEND=http
